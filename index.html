<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venkata Madhan Kanakala | Portfolio</title>
    <style>
        /* Reset & Base */
        * { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
        body { 
            background-color: #050505; 
            color: #f0f0f0; 
            overflow-x: hidden; 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
        }
        h1, h2, h3, .nav-logo { font-family: 'Playfair Display', serif; font-weight: 400; }
        a, button { text-decoration: none; color: inherit; outline: none; }
        
        /* Typography & Colors */
        .gold { color: #d4af37; font-style: italic; }

        /* Custom Cursor */
        .cursor-dot, .cursor-outline {
            position: fixed; top: 0; left: 0; transform: translate(-50%, -50%);
            border-radius: 50%; z-index: 9999; pointer-events: none;
        }
        .cursor-dot { width: 8px; height: 8px; background-color: #d4af37; transition: width 0.2s, height 0.2s; }
        .cursor-outline { 
            width: 40px; height: 40px; border: 1px solid rgba(212, 175, 55, 0.5); 
            transition: width 0.2s, height 0.2s, background-color 0.2s; 
        }

        /* Navigation */
        nav { 
            display: flex; justify-content: space-between; padding: 2rem 4rem; 
            position: fixed; width: 100%; z-index: 100; background: rgba(5,5,5,0.8);
            backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: all 0.4s ease;
        }
        .nav-logo { font-size: 1.2rem; letter-spacing: 4px; color: #fff; }
        .nav-links { display: flex; gap: 2.5rem; align-items: center; font-size: 0.75rem; letter-spacing: 3px; color: #aaa; text-transform: uppercase; }
        .nav-links a { transition: color 0.3s; }
        .nav-links a:hover { color: #d4af37; }
        .cv-link { border: 1px solid #d4af37; padding: 8px 16px; border-radius: 4px; color: #d4af37 !important; transition: all 0.3s ease !important; }
        .cv-link:hover { background: #d4af37; color: #000 !important; }

        /* Hero Section */
        .hero { 
            height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center; 
            background: radial-gradient(circle at center, #151515 0%, #050505 100%); 
            position: relative;
        }
        .hero h1 { font-size: 4.5rem; letter-spacing: 8px; margin-bottom: 1rem; color: #fff; opacity: 0; animation: fadeUp 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.3s; }
        .hero p.role { font-size: 1.2rem; letter-spacing: 6px; color: #888; opacity: 0; animation: fadeUp 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.5s; }
        .hero p.location { margin-top: 1rem; font-size: 0.85rem; letter-spacing: 3px; color: #555; opacity: 0; animation: fadeUp 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.7s; }
        
        .hero-cta { margin-top: 3rem; opacity: 0; animation: fadeUp 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.9s; }
        .btn-primary {
            display: inline-block; padding: 15px 40px; font-size: 0.8rem; letter-spacing: 4px;
            text-transform: uppercase; color: #000; background: #d4af37; 
            border: 1px solid #d4af37; transition: all 0.4s ease;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
        }
        .btn-primary:hover { background: transparent; color: #d4af37; box-shadow: 0 0 30px rgba(212, 175, 55, 0.4); transform: translateY(-3px); }

        /* Section Layout */
        section { padding: 8rem 10%; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
        .section-title { font-size: 2.5rem; letter-spacing: 5px; margin-bottom: 4rem; text-align: center; color: #fff; text-transform: uppercase; }
        
        /* About Layout */
        .about-container { display: flex; gap: 6rem; align-items: center; }
        .about-image-wrapper { 
            flex: 1; position: relative; height: 600px; 
            background: linear-gradient(45deg, #0a0a0a, #1a1a1a);
            transform-style: preserve-3d; 
            transition: transform 0.1s ease-out; 
        }
        .about-image-wrapper::before, .about-image-wrapper::after {
            content: ''; position: absolute; width: 60px; height: 60px; z-index: 2; pointer-events: none;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); transform: translateZ(30px);
        }
        .about-image-wrapper::before { top: 20px; left: 20px; border-top: 1px solid #d4af37; border-left: 1px solid #d4af37; }
        .about-image-wrapper::after { bottom: 20px; right: 20px; border-bottom: 1px solid #d4af37; border-right: 1px solid #d4af37; }
        
        .about-image-wrapper img {
            width: 100%; height: 100%; object-fit: cover; 
            filter: grayscale(100%) contrast(1.2) brightness(0.8); 
            transition: filter 0.8s ease, transform 0.8s ease;
            transform: translateZ(0);
        }
        .about-image-wrapper:hover img { filter: grayscale(0%) contrast(1.1) brightness(1); transform: scale(1.05) translateZ(10px); }
        .about-image-wrapper:hover::before { top: 0px; left: 0px; }
        .about-image-wrapper:hover::after { bottom: 0px; right: 0px; }

        .about-text { flex: 1.2; }
        .about-text h2 { font-size: 3.5rem; line-height: 1.1; margin-bottom: 2rem; color: #fff; }
        .about-text p { font-size: 1rem; line-height: 1.8; color: #999; margin-bottom: 1.5rem; font-weight: 300; }
        
        /* Skills Grid */
        .skills-grid { display: flex; gap: 4rem; margin-top: 3rem; border-top: 1px solid #222; padding-top: 2rem; }
        .skill-col h3 { font-size: 0.8rem; letter-spacing: 3px; color: #666; margin-bottom: 1.5rem; text-transform: uppercase; }
        .skill-col p { font-size: 0.9rem; color: #ccc; margin-bottom: 0.8rem; letter-spacing: 1px; }

        /* Projects Layout */
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 3rem; }
        
        /* Cinematic Card with Image */
        .project-card { 
            background: rgba(10, 10, 10, 0.6); backdrop-filter: blur(10px);
            border: 1px solid #1a1a1a; position: relative; overflow: hidden; z-index: 1;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column;
        }
        
        /* Project Image Styles */
        .project-img-container {
            width: 100%; height: 220px; overflow: hidden; position: relative;
        }
        .project-img-container::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to top, rgba(10,10,10,1), transparent); z-index: 1;
        }
        .project-img-container img {
            width: 100%; height: 100%; object-fit: cover;
            filter: grayscale(100%) brightness(0.6);
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), filter 0.8s ease;
        }
        
        /* Project Text Container */
        .project-content { padding: 2rem; flex-grow: 1; }
        
        /* Hover Effects */
        .project-card::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.1) 0%, transparent 60%);
            opacity: 0; transition: opacity 0.6s ease; z-index: -1; pointer-events: none;
        }
        .project-card:hover { 
            transform: translateY(-15px) scale(1.03); 
            border-color: rgba(212, 175, 55, 0.4); 
            box-shadow: 0 30px 60px rgba(0,0,0,0.9), 0 0 30px rgba(212, 175, 55, 0.05);
        }
        .project-card:hover::before { opacity: 1; }
        
        /* Image Animation on Card Hover */
        .project-card:hover .project-img-container img {
            transform: scale(1.1);
            filter: grayscale(0%) brightness(1);
        }
        
        .project-card h3 { font-size: 1.5rem; color: #fff; margin-bottom: 1rem; transition: color 0.4s ease; }
        .project-card:hover h3 { color: #d4af37; }
        .project-card .tech { font-size: 0.75rem; color: #d4af37; letter-spacing: 2px; margin-bottom: 1.5rem; text-transform: uppercase; }
        .project-card p { font-size: 0.95rem; color: #888; line-height: 1.7; transition: color 0.4s ease; }
        .project-card:hover p { color: #bbb; }

        /* Contact Section */
        .contact { text-align: center; background: #080808; border-top: 1px solid #111; }
        .contact h2 { font-size: 3rem; margin-bottom: 2rem; color: #fff; }
        .contact p { font-size: 1.2rem; color: #999; margin-bottom: 3rem; }
        .contact-links { display: flex; justify-content: center; gap: 3rem; margin-top: 2rem; flex-wrap: wrap; }
        .contact-links a { font-size: 0.9rem; letter-spacing: 3px; color: #fff; text-transform: uppercase; padding-bottom: 5px; border-bottom: 1px solid transparent; transition: all 0.3s; }
        .contact-links a:hover { color: #d4af37; border-bottom: 1px solid #d4af37; transform: translateY(-3px); }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reveal { opacity: 0; transform: translateY(50px); transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }

        /* Responsive */
        @media(max-width: 900px) {
            .about-container { flex-direction: column; }
            .hero h1 { font-size: 2.5rem; }
            nav { padding: 1.5rem; }
            .nav-links { gap: 1rem; font-size: 0.6rem; }
            .about-image-wrapper { width: 100%; height: 400px; transform: none !important; } 
            * { cursor: auto; } 
            .cursor-dot, .cursor-outline { display: none; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
</head>

    <!-- Custom Cursor -->
    <div class="cursor-dot"></div>

    <nav>
        <div class="nav-logo">PORTFOLIO.</div>
        <div class="nav-links">
            <a href="#about" class="hover-target">About</a>
            <a href="#projects" class="hover-target">Projects</a>
            <a href="#contact" class="hover-target">Contact</a>
            <a href="resume.html" class="hover-target cv-link" target="_blank">Resume</a>
        </div>
    </nav>

    <section class="hero" id="home">
        <h1>VENKATA MADHAN KANAKALA</h1>
        <p class="role">JUNIOR DATA ANALYST / DATA ENGINEER</p>
        <p class="location">BASED IN INDIA</p>
        <div class="hero-cta">
            <a href="resume.html" class="btn-primary hover-target" target="_blank">View My CV</a>
        </div>
    </
