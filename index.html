<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venkata Madhan Kanakala | Portfolio</title>
    <style>
        /* Reset & Base */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: #050505; 
            color: #f0f0f0; 
            overflow-x: hidden; 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
        }
        h1, h2, h3, .nav-logo { font-family: 'Playfair Display', serif; font-weight: 400; }
        a { text-decoration: none; color: inherit; transition: color 0.3s; }
        a:hover { color: #d4af37; }
        
        /* Typography & Colors */
        .gold { color: #d4af37; font-style: italic; }

        /* Navigation */
        nav { 
            display: flex; justify-content: space-between; padding: 2rem 4rem; 
            position: fixed; width: 100%; z-index: 100; background: rgba(5,5,5,0.9);
            backdrop-filter: blur(10px);
        }
        .nav-logo { font-size: 1.2rem; letter-spacing: 4px; color: #fff; }
        .nav-links { display: flex; gap: 2.5rem; font-size: 0.75rem; letter-spacing: 3px; color: #aaa; text-transform: uppercase; }

        /* Hero Section */
        .hero { 
            height: 100vh; display: flex; flex-direction: column; 
            justify-content: center; align-items: center; text-align: center; 
            background: radial-gradient(circle at center, #151515 0%, #050505 100%); 
        }
        .hero h1 { font-size: 4rem; letter-spacing: 6px; margin-bottom: 1rem; color: #fff; opacity: 0; animation: fadeUp 1.5s ease forwards 0.3s; }
        .hero p.role { font-size: 1.1rem; letter-spacing: 5px; color: #888; opacity: 0; animation: fadeUp 1.5s ease forwards 0.6s; }
        .hero p.location { margin-top: 1rem; font-size: 0.8rem; letter-spacing: 2px; color: #555; opacity: 0; animation: fadeUp 1.5s ease forwards 0.9s; }
        
        /* Section Layout */
        section { padding: 8rem 10%; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
        .section-title { font-size: 2rem; letter-spacing: 4px; margin-bottom: 4rem; text-align: center; color: #fff; text-transform: uppercase; }
        
        /* About Layout */
        .about-container { display: flex; gap: 6rem; align-items: center; }
        .about-image-wrapper { 
            flex: 1; position: relative; height: 600px; 
            background: #111; 
        }
        /* Gold corner accents */
        .about-image-wrapper::before {
            content: ''; position: absolute; top: -20px; left: -20px; width: 60px; height: 60px; 
            border-top: 1px solid #d4af37; border-left: 1px solid #d4af37; z-index: 2; pointer-events: none;
        }
        .about-image-wrapper::after {
            content: ''; position: absolute; bottom: -20px; right: -20px; width: 60px; height: 60px; 
            border-bottom: 1px solid #d4af37; border-right: 1px solid #d4af37; z-index: 2; pointer-events: none;
        }
        .about-image-wrapper img {
            width: 100%; height: 100%; object-fit: cover; 
            filter: grayscale(100%) contrast(1.2) brightness(0.8); 
            transition: all 0.5s ease;
        }
        .about-image-wrapper:hover img { filter: grayscale(0%) contrast(1) brightness(1); }

        .about-text { flex: 1.2; }
        .about-text h2 { font-size: 3.5rem; line-height: 1.1; margin-bottom: 2rem; color: #fff; }
        .about-text p { font-size: 1rem; line-height: 1.8; color: #999; margin-bottom: 1.5rem; font-weight: 300; }
        
        /* Skills Grid */
        .skills-grid { display: flex; gap: 4rem; margin-top: 3rem; border-top: 1px solid #222; padding-top: 2rem; }
        .skill-col h3 { font-size: 0.8rem; letter-spacing: 3px; color: #666; margin-bottom: 1.5rem; text-transform: uppercase; }
        .skill-col p { font-size: 0.9rem; color: #ccc; margin-bottom: 0.8rem; letter-spacing: 1px; }

        /* Projects Layout */
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 2rem; }
        .project-card { 
            background: #0a0a0a; border: 1px solid #1a1a1a; padding: 3rem 2rem; 
            transition: transform 0.4s ease, border-color 0.4s ease;
        }
        .project-card:hover { transform: translateY(-10px); border-color: #333; }
        .project-card h3 { font-size: 1.5rem; color: #fff; margin-bottom: 1rem; }
        .project-card .tech { font-size: 0.75rem; color: #d4af37; letter-spacing: 2px; margin-bottom: 1.5rem; text-transform: uppercase; }
        .project-card p { font-size: 0.9rem; color: #888; line-height: 1.6; }

        /* Contact Section */
        .contact { text-align: center; background: #080808; }
        .contact h2 { font-size: 3rem; margin-bottom: 2rem; color: #fff; }
        .contact p { font-size: 1.2rem; color: #999; margin-bottom: 3rem; }
        .contact-links { display: flex; justify-content: center; gap: 3rem; margin-top: 2rem; }
        .contact-links a { font-size: 0.9rem; letter-spacing: 3px; color: #fff; text-transform: uppercase; padding-bottom: 5px; border-bottom: 1px solid transparent; }
        .contact-links a:hover { color: #d4af37; border-bottom: 1px solid #d4af37; }

        /* Animations */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reveal { opacity: 0; transform: translateY(40px); transition: all 1s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }
